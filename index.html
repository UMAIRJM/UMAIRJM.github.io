<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umair - Games</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: linear-gradient(#2b1055, #120626); color: #fff; min-height: 100vh; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
  h1 { margin: 0 0 8px; } p { color: #d6ccf5; }
  .game { display: flex; gap: 20px; align-items: center; background: rgba(255,255,255,0.07); border: 2px solid #ff4fd8; border-radius: 20px; padding: 20px; margin-top: 32px; }
  .game img { width: 96px; height: 96px; border-radius: 22px; }
  a { color: #3df2ff; }
</style>
</head>
<body>
<main>
  <h1>Umair</h1>
  <p>Indie games for Android.</p>
  <div class="game">
    <img src="thedash-icon.png" alt="The Dash icon">
    <div>
      <h2 style="margin:0">The Dash</h2>
      <p style="margin:6px 0">Tap to jump, dodge spikes and dash through 5 neon worlds.</p>
      <a href="https://play.google.com/store/apps/details?id=com.umairgame.thedash">Google Play</a> &middot;
      <a href="https://umairjm.github.io/thedash-policy/">Privacy Policy</a>
    </div>
  </div>
  <p style="margin-top:32px">Contact: <a href="mailto:ghaziuddin789@gmail.com">ghaziuddin789@gmail.com</a></p>
</main>
</body>
</html>
